<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>I. La Chiave</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Unicase:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080605}
body{display:grid;place-items:center;font-family:"Cormorant Unicase",serif}
.page{
  position:relative;width:min(100vw,66.6667vh);aspect-ratio:2/3;overflow:hidden;
  background:url("sfondo-la-chiave.png") center/cover no-repeat;color:#ead9ad;
}
.veil{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(4,3,3,.08),rgba(4,3,3,.30) 28%,rgba(4,3,3,.22) 68%,rgba(4,3,3,.06));
}
.panel{
  position:absolute;z-index:2;top:23%;left:12%;right:12%;text-align:center;
  text-shadow:0 2px 8px #000,0 0 15px rgba(0,0,0,.95);
}
.title{
  margin:0 0 1.15rem;
  font:700 clamp(22px,5.3cqw,35px)/1.08 "Cinzel Decorative",serif;
  letter-spacing:.045em;color:#d8b66d;
}
.riddle,.question,.hint,.feedback{
  font-family:"Cormorant Unicase",serif;
  font-weight:600;
}
.riddle{
  margin:0 auto 1rem;max-width:94%;
  font-size:clamp(15px,3.45cqw,22px);line-height:1.23;
}
.riddle p{margin:.15rem 0}
.question{
  margin:.8rem 0 .85rem;
  font-size:clamp(17px,3.9cqw,24px);
}
.answer{
  width:82%;padding:.62rem .75rem;text-align:center;
  border:1px solid rgba(218,181,105,.82);border-radius:3px;
  background:rgba(13,8,7,.76);color:#f0dba8;outline:none;
  font:600 clamp(14px,3.2cqw,20px)/1 "Cormorant Unicase",serif;
  box-shadow:inset 0 0 16px rgba(0,0,0,.55),0 0 10px rgba(190,135,58,.12);
}
.answer::placeholder{color:rgba(238,215,164,.58)}
.answer:focus{border-color:#e3c47e}
.btn{
  display:block;margin:.72rem auto 0;padding:.62rem .9rem;min-width:62%;
  border:1px solid #c99e54;border-radius:3px;background:rgba(46,15,11,.88);
  color:#e1c47e;
  font:700 clamp(12px,2.75cqw,17px)/1.1 "Cinzel Decorative",serif;
  letter-spacing:.035em;cursor:pointer;box-shadow:0 0 14px rgba(0,0,0,.68);
}
.hint,.feedback{
  opacity:0;transform:translateY(5px);transition:.65s ease;
  margin:.8rem auto 0;max-width:92%;
  font-size:clamp(14px,3.15cqw,20px);line-height:1.15;
}
.hint.show,.feedback.show{opacity:1;transform:none}
.hint{color:#d8c49a}
.success-title{
  display:block;margin-bottom:.35rem;color:#e2c273;
  font-family:"Cinzel Decorative",serif;font-weight:700;
}
.next{display:none}
.next.show{display:block;animation:fade .7s ease forwards}

/* comparsa sequenziale */
.reveal{opacity:0;transform:translateY(7px);animation:fade .85s ease forwards}
.s1{animation-delay:.35s}
.s2{animation-delay:1.65s}
.s3{animation-delay:3.0s}
.s4{animation-delay:4.25s}
.s5{animation-delay:5.35s}
@keyframes fade{to{opacity:1;transform:translateY(0)}}

@media(max-height:650px){
  .panel{top:20%}
  .title{margin-bottom:.8rem}
  .riddle{margin-bottom:.65rem}
}
</style>
</head>
<body>
<main class="page">
  <div class="veil"></div>
  <section class="panel">
    <h1 class="title reveal s1">I. LA CHIAVE</h1>

    <div class="riddle">
      <p class="reveal s2">Non ho carne e non ho ossa,<br>ma ti seguo senza sosta.</p>
      <p class="reveal s3">Nasco quando la luce mi dà vita,<br>scompaio quando la notte è infinita.</p>
    </div>

    <div class="question reveal s4">Che cosa sono?</div>

    <div class="reveal s5">
      <input id="risposta" class="answer" type="text" autocomplete="off"
             placeholder="Scrivi la tua risposta…" aria-label="Scrivi la tua risposta">
      <button id="indovina" class="btn" type="button">✦ INDOVINA LA CHIAVE ✦</button>
    </div>

    <div id="feedback" class="feedback" aria-live="polite"></div>
    <div id="hint" class="hint"><strong>SUGGERIMENTO:</strong><br>Seguo ogni tuo passo ma non puoi afferrarmi,<br>svanisco nel buio se provi a cercarmi</div>
    <button id="next" class="btn next" type="button">PROSEGUI</button>
  </section>
</main>

<script>
const input=document.getElementById('risposta');
const button=document.getElementById('indovina');
const hint=document.getElementById('hint');
const feedback=document.getElementById('feedback');
const next=document.getElementById('next');
let errors=0;

function normalizza(s){
  return s.trim().toLocaleLowerCase('it-IT')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function check(){
  const value=normalizza(input.value);
  if(!value){ input.focus(); return; }

  if(value==='ombra' || value==="l'ombra" || value==='lombra'){
    feedback.innerHTML =
      '<span class="success-title">LA PRIMA SOGLIA È STATA ATTRAVERSATA</span>' +
      'L’Ombra ti riconosce<br>Il cammino prosegue';
    feedback.classList.add('show');
    hint.classList.remove('show');
    next.classList.add('show');
    input.disabled=true;
    button.disabled=true;
    setTimeout(()=>{ window.location.href='../pagina5/index.html'; }, 2600);
    return;
  }

  errors++;
  feedback.textContent='La Chiave non riconosce questa risposta';
  feedback.classList.add('show');
  if(errors>=2) hint.classList.add('show');
  input.select();
}
button.addEventListener('click',check);
input.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
next.addEventListener('click',()=>{ window.location.href='../pagina5/index.html'; });
</script>
</body>
</html>
