<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>II. Il Sigillo</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Unicase:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080604}
body{display:grid;place-items:center;min-height:100vh;overflow:hidden}
.page{position:relative;width:min(100vw,66.6667vh);aspect-ratio:2/3;overflow:hidden;background:#100a06 url("sfondo-pagina5.png") center/cover no-repeat}
.title,.riddle,.sigils,.result{position:absolute}
.title{
 top:5.6%;left:8%;right:8%;text-align:center;
 font:700 clamp(18px,4.6vw,30px)/1.05 "Cinzel Decorative",serif;
 letter-spacing:.045em;color:#d9bd78;text-shadow:0 2px 5px #000,0 0 12px #000;
 opacity:0;transform:translateY(7px);animation:reveal .7s .35s forwards
}
.riddle{
 top:14.2%;left:13%;right:13%;text-align:center;
 font:600 clamp(13px,3.15vw,19px)/1.28 "Cormorant Unicase",serif;
 color:#d9bd78;text-shadow:0 2px 4px #000,0 0 9px #000;
 opacity:0;transform:translateY(7px);animation:reveal .8s 1.05s forwards
}
.sigils{
 top:43.2%;left:16%;right:16%;height:25.8%;
 display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
 column-gap:15%;row-gap:7%
}
.sig{
 appearance:none;border:0;background:transparent;padding:0;display:grid;place-items:center;
 cursor:pointer;min-width:44px;min-height:44px;-webkit-tap-highlight-color:transparent;
 opacity:0;transform:scale(.82);animation:sigilIn .5s forwards
}
.sig:nth-child(1){animation-delay:2.20s}.sig:nth-child(2){animation-delay:2.55s}
.sig:nth-child(3){animation-delay:2.90s}.sig:nth-child(4){animation-delay:3.25s}
.sig svg{width:78%;height:78%;overflow:visible}
.sig line,.sig path,.sig circle,.sig polygon{fill:none;stroke:#4a2817;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.sig:focus-visible{outline:2px solid #80512d;outline-offset:2px;border-radius:50%}
.sig.wrong{opacity:1;animation:wrong .5s ease!important}
.sig.correct svg{animation:ember 1.2s ease forwards}
.sig.correct line,.sig.correct path,.sig.correct circle,.sig.correct polygon{stroke:#9b3f1c}
.result{
 left:7%;right:7%;bottom:5.4%;text-align:center;color:#d9bd78;
 text-shadow:0 2px 5px #000,0 0 10px #000;opacity:0;transform:translateY(7px);pointer-events:none
}
.result.show{animation:reveal .7s forwards}
.result h2{margin:0 0 .3em;font:700 clamp(12px,3vw,18px)/1.15 "Cinzel Decorative",serif;letter-spacing:.025em}
.result p{margin:0;font:600 clamp(12px,2.9vw,17px)/1.15 "Cormorant Unicase",serif}
.feedback{
 position:absolute;left:8%;right:8%;bottom:5.4%;text-align:center;color:#d9bd78;
 text-shadow:0 2px 5px #000;font:600 clamp(12px,2.85vw,17px)/1.18 "Cormorant Unicase",serif;
 opacity:0;pointer-events:none
}
.feedback.show{animation:reveal .55s forwards}


@keyframes reveal{to{opacity:1;transform:none}}
@keyframes sigilIn{to{opacity:1;transform:scale(1)}}
@keyframes wrong{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@keyframes ember{0%{filter:none}45%{filter:drop-shadow(0 0 7px #b84c1d) drop-shadow(0 0 15px #e0872d)}100%{filter:drop-shadow(0 0 5px #8f3b1a)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important}}
</style>
</head>
<body>
<main class="page">
 </div>
 <div class="title">II. IL SIGILLO</div>
 <div class="riddle">
  Quattro segni il Registro ha celato,<br>
  uno soltanto dev’essere trovato.<br>
  Tra i sacri simboli che il tempo ha custodito,<br>
  cerca del Fuoco il suo sigillo antico.
 </div>

 <div class="sigils" aria-label="Scegli il sigillo del Fuoco">
  <button class="sig" type="button" data-correct="false" aria-label="Primo sigillo">
   <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="34"/><path d="M25 62 Q50 26 75 62 Q50 76 25 62Z"/><circle cx="50" cy="55" r="7"/></svg>
  </button>
  <button class="sig" type="button" data-correct="true" aria-label="Secondo sigillo">
   <svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,18 82,76 18,76"/></svg>
  </button>
  <button class="sig" type="button" data-correct="false" aria-label="Terzo sigillo">
   <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="33"/><path d="M50 17 C32 30 33 49 50 50 C67 51 68 70 50 83 C31 70 31 51 50 50 C69 49 69 30 50 17Z"/></svg>
  </button>
  <button class="sig" type="button" data-correct="false" aria-label="Quarto sigillo">
   <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="33"/><path d="M50 18 V82 M18 50 H82 M27 27 L73 73 M73 27 L27 73"/></svg>
  </button>
 </div>

 <div class="feedback" aria-live="polite"></div>
 <div class="result" aria-live="polite">
  <h2>IL SIGILLO È STATO RICONOSCIUTO</h2>
  <p>Il Fuoco ricorda. Il Registro si prepara ad accoglierti.</p>
 </div>
</main>
<script>
const sigils=[...document.querySelectorAll(".sig")], feedback=document.querySelector(".feedback"), result=document.querySelector(".result");
let errors=0,solved=false;
sigils.forEach(s=>s.addEventListener("click",()=>{
 if(solved)return;
 if(s.dataset.correct==="true"){
  solved=true; feedback.classList.remove("show"); feedback.innerHTML="";
  s.classList.add("correct"); result.classList.add("show"); sigils.forEach(x=>x.disabled=true);
  setTimeout(()=>{ window.location.href="../pagina6/index.html"; },3500);
 }else{
  errors++; s.classList.remove("wrong"); void s.offsetWidth; s.classList.add("wrong");
  feedback.innerHTML=errors>=2?"<strong>SUGGERIMENTO:</strong><br>Il suo segno si innalza verso il cielo":"Il Registro non riconosce questo sigillo";
  feedback.classList.remove("show"); void feedback.offsetWidth; feedback.classList.add("show");
 }
}));
</script>
</body>
</html>
